<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="${assignment.id == null} ? 'Add Assignment' : 'Edit Assignment'"></title>
</head>
<body>

<h1 th:text="${assignment.id == null} ? 'Add New Assignment' : 'Edit Assignment'"></h1>

<!-- ---------------- CREATE ---------------- -->
<form th:if="${assignment.id == null}"
      th:action="@{/assignments}"
      th:object="${assignment}"
      method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required/><br/><br/>

    <label>Order ID:</label>
    <input type="text" th:field="*{orderId}" required/><br/><br/>

    <label>Staff ID (Server/Chef):</label>
    <input type="text" th:field="*{staffId}" required/><br/><br/>

    <button type="submit">Save</button>
</form>

<!-- ---------------- UPDATE ---------------- -->
<form th:if="${assignment.id != null}"
      th:action="@{'/assignments/' + ${assignment.id}}"
      th:object="${assignment}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Order ID:</label>
    <input type="text" th:field="*{orderId}" required/><br/><br/>

    <label>Staff ID (Server/Chef):</label>
    <input type="text" th:field="*{staffId}" required/><br/><br/>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/assignments}">Back to list</a></p>

</body>
</html>
