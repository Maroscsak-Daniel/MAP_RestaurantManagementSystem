<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chef</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="border-bottom:1px solid #e9ecef;">
    <div class="container"><a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a></div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 th:text="${chef.id == null} ? 'Create Chef' : 'Edit Chef'">Form</h4>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form method="post" th:action="${chef.id == null} ? @{/chefs} : @{/chefs/{id}(id=${chef.id})}" th:object="${chef}">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="form-group">
                    <label for="rank">Rank</label>
                    <input id="rank" type="text" th:field="*{rank}" class="form-control" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('rank')}" th:errors="*{rank}"></div>
                </div>

                <button type="submit" class="btn btn-brand btn-pill" th:text="${chef.id == null} ? 'Create' : 'Save'"></button>
                <a th:href="@{/chefs}" class="btn btn-outline-secondary btn-pill">Cancel</a>
            </form>
        </div>
    </div>
</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
