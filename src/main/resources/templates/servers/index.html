<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Servers</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
        <div class="ml-auto">
            <a class="btn btn-sm btn-brand btn-pill ml-2" th:href="@{/servers}">Servers</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0">Servers</h1>
            <div class="text-muted small">Manage front-of-house staff</div>
        </div>
        <div class="text-right">
            <div class="mb-2">
                <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/servers/new}">Add Server</a>
            </div>
            <div class="text-muted small">Results</div>
            <div class="h5" th:text="${#lists.size(servers)}">0</div>
        </div>
    </div>

    <div class="card mb-3 filter-card">
        <div class="card-body">
            <form method="get" class="form-inline filter-row">
                <label for="shift" class="mr-2">Shift</label>
                <input id="shift" name="shift" class="form-control mr-3" placeholder="Shift" th:value="${shift}" />

                <label for="minExp" class="mr-2">Min experience</label>
                <input id="minExp" name="minExp" type="number" class="form-control mr-3" th:value="${minExp}" />

                <label for="sortSelect" class="mr-2">Sort</label>
                <select id="sortSelect" name="sort" class="form-control mr-2">
                    <option value="id" th:selected="${currentSort == 'id'}">ID</option>
                    <option value="experienceYears" th:selected="${currentSort == 'experienceYears'}">Experience</option>
                </select>

                <select name="dir" id="dirSelect" class="form-control mr-3">
                    <option value="asc" th:selected="${currentDir == 'asc'}">ASC</option>
                    <option value="desc" th:selected="${currentDir == 'desc'}">DESC</option>
                </select>

                <button type="submit" class="btn btn-brand btn-pill mr-2">Apply</button>
                <a th:href="@{/servers}" class="btn btn-outline-secondary btn-pill">Reset</a>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
            <tr>
                <th><a th:href="@{/servers(sort='id', dir=${currentSort=='id' && currentDir=='asc' ? 'desc' : 'asc'}, shift=${shift}, minExp=${minExp})}">ID
                    <span th:if="${currentSort=='id'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th>Name</th>
                <th>Shift</th>
                <th><a th:href="@{/servers(sort='experienceYears', dir=${currentSort=='experienceYears' && currentDir=='asc' ? 'desc' : 'asc'}, shift=${shift}, minExp=${minExp})}">Experience
                    <span th:if="${currentSort=='experienceYears'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${servers}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.shift}"></td>
                <td th:text="${s.experienceYears}"></td>
                <td class="table-actions text-right">
                    <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/servers/{id}(id=${s.id})}">Details</a>
                    <a class="btn btn-sm btn-outline-secondary btn-pill" th:href="@{/servers/{id}/edit(id=${s.id})}">Edit</a>
                    <form th:action="@{/servers/{id}/delete(id=${s.id})}" method="post" style="display:inline-block;">
                        <button type="submit" class="btn btn-sm btn-danger btn-pill">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(servers)}">
                <td colspan="5" class="text-center text-muted">No servers found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <nav th:if="${page != null}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/servers(page=${page.number - 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, shift=${shift}, minExp=${minExp})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? ' active'">
                    <a class="page-link" th:href="@{/servers(page=${i}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, shift=${shift}, minExp=${minExp})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/servers(page=${page.number + 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, shift=${shift}, minExp=${minExp})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
