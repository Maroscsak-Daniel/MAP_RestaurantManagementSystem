<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment Details</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
    <style>
        /* prevent content from being hidden under fixed navbar */
        /* global padding handled in app.css */
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4>Assignment Details <small th:text="${assignment.id}"></small></h4>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${assignment.id}"></span></p>
            <p><strong>Order:</strong>
                <a th:if="${assignment.order != null}" class="text-dark" th:href="@{/orders/{id}(id=${assignment.order.id})}" th:text="${'Order ' + assignment.order.id}"></a>
                <span th:if="${assignment.order == null}">N/A</span>
            </p>
            <p><strong>Staff ID:</strong> <span th:text="${assignment.staffId}"></span></p>

            <div class="mt-3">
                <a th:href="@{/assignments}" class="btn btn-outline-secondary btn-pill">Back</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
