<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Assignment Details</title>
</head>
<body>

<h1>Assignment Details</h1>

<p><strong>ID:</strong> <span th:text="${assignment.id}"></span></p>
<p><strong>Order ID:</strong> <span th:text="${assignment.order != null ? assignment.order.id : 'N/A'}"></span></p>
<p><strong>Staff ID:</strong> <span th:text="${assignment.staffId}"></span></p>

<p><a th:href="@{/assignments}">Back to list</a></p>

</body>
</html>
