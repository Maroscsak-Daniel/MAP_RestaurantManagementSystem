<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${assignment.id == null} ? 'Add Assignment' : 'Edit Assignment'"></title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 th:text="${assignment.id} == null ? 'Create Assignment' : 'Edit Assignment'">Form</h4>
        </div>
        <div class="card-body">

            <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Create form -->
            <form th:if="${assignment.id == null}" method="post" th:action="@{/assignments}" th:object="${assignment}">
                <div class="form-group">
                    <label for="orderSelect">Order</label>
                    <select id="orderSelect" th:field="*{order.id}" class="form-control" required>
                        <option value="">-- select order --</option>
                        <option th:each="o : ${orders}"
                                th:value="${o.id}"
                                th:text="${o.id}"
                                th:selected="${assignment.order != null and o.id == assignment.order.id}">
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('order')}" th:errors="*{order}"></div>
                </div>

                <div class="form-group">
                    <label for="staffChefCreate">Chef</label>
                    <select id="staffChefCreate" name="chefId" class="form-control">
                        <option value="">-- select chef (optional) --</option>
                        <option th:each="c : ${chefs}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${selectedChef != null and selectedChef == c.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="staffServerCreate">Server</label>
                    <select id="staffServerCreate" name="serverId" class="form-control">
                        <option value="">-- select server (optional) --</option>
                        <option th:each="s : ${servers}"
                                th:value="${s.id}"
                                th:text="${s.name}"
                                th:selected="${selectedServer != null and selectedServer == s.id}"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-brand btn-pill">Create</button>
                <a th:href="@{/assignments}" class="btn btn-outline-secondary btn-pill">Cancel</a>
            </form>

            <!-- Edit form (order fixed) -->
            <form th:if="${assignment.id != null}" method="post" th:action="@{/assignments/{id}(id=${assignment.id})}" th:object="${assignment}">
                <div class="form-group">
                    <label>Order</label>
                    <input type="text" class="form-control" th:value="${assignment.order != null ? assignment.order.id : ''}" readonly />
                </div>

                <div class="form-group">
                    <label for="staffChefEdit">Chef</label>
                    <select id="staffChefEdit" name="chefId" class="form-control">
                        <option value="">-- select chef (optional) --</option>
                        <option th:each="c : ${chefs}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${selectedChef != null and selectedChef == c.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="staffServerEdit">Server</label>
                    <select id="staffServerEdit" name="serverId" class="form-control">
                        <option value="">-- select server (optional) --</option>
                        <option th:each="s : ${servers}"
                                th:value="${s.id}"
                                th:text="${s.name}"
                                th:selected="${selectedServer != null and selectedServer == s.id}"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-brand btn-pill">Save</button>
                <a th:href="@{/assignments}" class="btn btn-outline-secondary btn-pill">Cancel</a>
            </form>

        </div>
    </div>
</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
