<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${assignment.id == null} ? 'Add Assignment' : 'Edit Assignment'"></title>
</head>
<body>

<h1 th:text="${assignment.id == null} ? 'Add New Assignment' : 'Edit Assignment'"></h1>

<form th:action="${assignment.id == null} ? @{/assignments} : @{'/assignments/' + ${assignment.id}}"
      th:object="${assignment}"
      method="post">

    <label>Order ID:</label>
    <input type="number" th:field="*{order.id}" required/><br/><br/>

    <label>Staff ID:</label>
    <input type="text" th:field="*{staffId}" required/><br/><br/>

    <button type="submit"
            th:text="${assignment.id == null} ? 'Create' : 'Update'">
    </button>

</form>

<p><a th:href="@{/assignments}">Back to list</a></p>

</body>
</html>
