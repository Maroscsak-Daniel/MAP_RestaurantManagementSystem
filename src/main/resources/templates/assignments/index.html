<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignments</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
        <div class="ml-auto">
            <a class="btn btn-sm btn-brand btn-pill ml-2" th:href="@{/assignments}">Assignments</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0">Assignments</h1>
            <div class="text-muted small">Manage staff assignments to orders</div>
        </div>
        <div class="text-right">
            <div class="mb-2">
                <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/assignments/new}">Add Assignment</a>
            </div>
            <div class="text-muted small">Results</div>
            <div class="h5" th:text="${#lists.size(assignments)}">0</div>
        </div>
    </div>

    <div class="card mb-3 filter-card">
        <div class="card-body">
            <form method="get" class="form-inline filter-row">
                <label for="orderSelect" class="mr-2">Order</label>
                <select id="orderSelect" name="orderId" class="form-control mr-3">
                    <option value="">All</option>
                    <option th:each="o : ${orders}"
                            th:value="${o.id}"
                            th:text="${'Order ' + o.id}"
                            th:selected="${o.id == currentOrder}">
                    </option>
                </select>

                <label for="staffInput" class="mr-2">Staff</label>
                <input id="staffInput" name="staff" class="form-control mr-3" placeholder="Staff id/name" th:value="${currentStaff}" />

                <label for="sortSelect" class="mr-2">Sort</label>
                <select id="sortSelect" name="sort" class="form-control mr-2">
                    <option value="id" th:selected="${currentSort == 'id'}">ID</option>
                    <option value="order.id" th:selected="${currentSort == 'order.id'}">Order</option>
                    <option value="staffId" th:selected="${currentSort == 'staffId'}">Staff</option>
                </select>

                <select name="dir" id="dirSelect" class="form-control mr-3">
                    <option value="asc" th:selected="${currentDir == 'asc'}">ASC</option>
                    <option value="desc" th:selected="${currentDir == 'desc'}">DESC</option>
                </select>

                <button type="submit" class="btn btn-brand btn-pill mr-2">Apply</button>
                <a th:href="@{/assignments}" class="btn btn-outline-secondary btn-pill">Reset</a>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
            <tr>
                <th><a th:href="@{/assignments(sort='id', dir=${currentSort=='id' && currentDir=='asc' ? 'desc' : 'asc'}, orderId=${currentOrder}, staff=${currentStaff})}">ID
                    <span th:if="${currentSort=='id'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th><a th:href="@{/assignments(sort='order.id', dir=${currentSort=='order.id' && currentDir=='asc' ? 'desc' : 'asc'}, orderId=${currentOrder}, staff=${currentStaff})}">Order
                    <span th:if="${currentSort=='order.id'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th><a th:href="@{/assignments(sort='staffId', dir=${currentSort=='staffId' && currentDir=='asc' ? 'desc' : 'asc'}, orderId=${currentOrder}, staff=${currentStaff})}">Staff
                    <span th:if="${currentSort=='staffId'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${assignments}">
                <td th:text="${a.id}"></td>
                <td>
                    <a class="text-dark" th:href="@{/orders/{id}(id=${a.order != null ? a.order.id : ''})}" th:text="${a.order != null ? a.order.id : 'N/A'}"></a>
                </td>
                <td th:text="${a.staffId}"></td>
                <td class="table-actions text-right">
                    <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/assignments/{id}(id=${a.id})}">Details</a>
                    <a class="btn btn-sm btn-outline-secondary btn-pill" th:href="@{/assignments/{id}/edit(id=${a.id})}">Edit</a>
                    <form th:action="@{/assignments/{id}/delete(id=${a.id})}" method="post" style="display:inline-block;">
                        <button type="submit" class="btn btn-sm btn-danger btn-pill">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(assignments)}">
                <td colspan="4" class="text-center text-muted">No assignments found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <nav th:if="${page != null}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/assignments(page=${page.number - 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, orderId=${currentOrder}, staff=${currentStaff})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? ' active'">
                    <a class="page-link" th:href="@{/assignments(page=${i}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, orderId=${currentOrder}, staff=${currentStaff})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/assignments(page=${page.number + 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, orderId=${currentOrder}, staff=${currentStaff})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
