<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OrderLine Details</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="border-bottom:1px solid #e9ecef;">
    <div class="container"><a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a></div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4>OrderLine Details <small th:text="${orderline.id}"></small></h4>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${orderline.id}"></span></p>

            <p><strong>Order:</strong>
                <span th:if="${orderline.order != null}">
                    <a th:href="@{/orders/{id}(id=${orderline.order.id})}" class="text-dark" th:text="${'Order ' + orderline.order.id}"></a>
                </span>
                <span th:if="${orderline.order == null}">N/A</span>
            </p>

            <p><strong>Menu Item:</strong>
                <span th:text="${orderline.menuItem != null ? orderline.menuItem.name : 'None'}"></span>
            </p>

            <p><strong>Quantity:</strong>
                <span th:text="${orderline.quantity}"></span>
            </p>

            <p><strong>Allergens:</strong>
                <span th:text="${orderline.allergens}"></span>
            </p>

            <div class="mt-3">
                <a th:href="@{/orderlines}" class="btn btn-outline-secondary btn-pill">Back</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
