<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bills list</title>
</head>
<body>
<h1>Bills list</h1>

<p><a th:href="@{/bills/new}">Add new bill</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Order ID</th>
        <th>Total Amount</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="bill : ${bills}">
        <td th:text="${bill.id}"></td>
        <td th:text="${bill.orderId}"></td>
        <td th:text="${bill.totalAmount}"></td>

        <td>
            <a th:href="@{'/bills/' + ${bill.id}}">Details</a> |
            <a th:href="@{'/bills/' + ${bill.id} + '/edit'}">Edit</a> |

            <form th:action="@{'/bills/' + ${bill.id} + '/delete'}"
                  method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
