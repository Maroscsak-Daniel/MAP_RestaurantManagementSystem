<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Bon</title>
</head>
<body>
<h1>Adaugă Bon Nou</h1>
<form th:action="@{/bills}" th:object="${bill}" method="post">

    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="orderId">Order ID:</label>
    <input type="text" id="orderId" th:field="*{orderId}" required/><br/><br/>

    <label for="totalAmount">Total Suma:</label>
    <input type="number" step="0.01" id="totalAmount" th:field="*{totalAmount}" required/><br/><br/>

    <button type="submit">Salvează Bon</button>
</form>
<p><a th:href="@{/bills}">Înapoi la Listă</a></p>
</body>
</html>
