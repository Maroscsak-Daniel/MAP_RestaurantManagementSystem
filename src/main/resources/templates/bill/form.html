<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${bill.id == null} ? 'Add Bill' : 'Edit Bill'"></title>
</head>
<body>

<h1 th:text="${bill.id == null} ? 'Add new bill' : 'Edit bill'"></h1>

<!-- CREATE -->
<form th:if="${bill.id == null}"
      th:action="@{/bills}"
      th:object="${bill}"
      method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required/><br/><br/>

    <label>Order ID:</label>
    <input type="text" th:field="*{orderId}" required/><br/><br/>

    <label>Total Amount:</label>
    <input type="number" step="0.01" th:field="*{totalAmount}" required/><br/><br/>

    <button type="submit">Save bill</button>
</form>

<!-- UPDATE -->
<form th:if="${bill.id != null}"
      th:action="@{'/bills/' + ${bill.id}}"
      th:object="${bill}"
      method="post">

    <input type="hidden" th:field="*{id}" />

    <label>Order ID:</label>
    <input type="text" th:field="*{orderId}" required/><br/><br/>

    <label>Total Amount:</label>
    <input type="number" step="0.01" th:field="*{totalAmount}" required/><br/><br/>

    <button type="submit">Update bill</button>
</form>

<p><a th:href="@{/bills}">Back to list</a></p>

</body>
</html>
