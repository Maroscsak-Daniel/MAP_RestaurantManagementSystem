<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>OrderLine list</title>
</head>
<body>
<h1>Orderline list</h1>

<p><a th:href="@{/orderlines/new}">Add new orderline</a></p>

<table border="1">
    <thead>
    <tr>
        <th>Line ID</th>
        <th>Menu item ID</th>
        <th>Quantity</th>
        <th>Allergens</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${orderlines}">
        <td th:text="${line.id}">L000</td>
        <td th:text="${line.menuItemId}">M000</td>
        <td th:text="${line.quantity}">1</td>
        <td th:text="${line.allergens}">Allergens</td>
        <td>
            <form th:action="@{'/orderlines/' + ${line.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
