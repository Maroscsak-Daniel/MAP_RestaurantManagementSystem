<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>OrderLine list</title>
</head>
<body>

<h1>OrderLine list</h1>

<p><a th:href="@{/orderlines/new}">Add new order line</a></p>

<table border="1">
    <thead>
    <tr>
        <th>Line ID</th>
        <th>Menu item ID</th>
        <th>Quantity</th>
        <th>Allergens</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="line : ${orderlines}">
        <td th:text="${line.id}"></td>
        <td th:text="${line.menuItemId}"></td>
        <td th:text="${line.quantity}"></td>
        <td th:text="${line.allergens}"></td>

        <td>
            <a th:href="@{'/orderlines/' + ${line.id}}">Details</a> |
            <a th:href="@{'/orderlines/' + ${line.id} + '/edit'}">Edit</a> |

            <form th:action="@{'/orderlines/' + ${line.id} + '/delete'}"
                  method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
