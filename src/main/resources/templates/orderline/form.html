<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Linie Comandă</title>
</head>
<body>
<h1>Adaugă Linie Comandă Nouă</h1>

<form th:action="@{/orderlines}" th:object="${orderLine}" method="post">

    <label for="id">ID Linie:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="menuItemId">Element Meniu ID:</label>
    <input type="text" id="menuItemId" th:field="*{menuItemId}" required/><br/><br/>

    <label for="quantity">Cantitate:</label>
    <input type="number" step="0.1" id="quantity" th:field="*{quantity}" required/><br/><br/>

    <label for="allergens">Alergeni/Notițe:</label>
    <input type="text" id="allergens" th:field="*{allergens}"/><br/><br/>

    <button type="submit">Salvează Linie</button>
</form>
<p><a th:href="@{/orderlines}">Înapoi la Listă</a></p>
</body>
</html>
