<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add order line</title>
</head>
<body>
<h1>Add new order line</h1>

<form th:action="@{/orderlines}" th:object="${orderline}" method="post">

    <label for="id">Line ID:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="menuItemId">Menu item ID:</label>
    <input type="text" id="menuItemId" th:field="*{menuItemId}" required/><br/><br/>

    <label for="quantity">Quantity:</label>
    <input type="number" step="0.1" id="quantity" th:field="*{quantity}" required/><br/><br/>

    <label for="allergens">Allergens:</label>
    <input type="text" id="allergens" th:field="*{allergens}"/><br/><br/>

    <button type="submit">Save line</button>
</form>
<p><a th:href="@{/orderlines}">Back to the list</a></p>
</body>
</html>
