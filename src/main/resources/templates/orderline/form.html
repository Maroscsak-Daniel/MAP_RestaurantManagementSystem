<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${orderline.id == null} ? 'Add OrderLine' : 'Edit OrderLine'"></title>
</head>
<body>

<h1 th:text="${orderline.id == null} ? 'Add New OrderLine' : 'Edit OrderLine'"></h1>

<!-- ---------------- CREATE ---------------- -->
<form th:if="${orderline.id == null}"
      th:action="@{/orderlines}"
      th:object="${orderline}"
      method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required/><br/><br/>

    <label>Menu Item ID:</label>
    <input type="text" th:field="*{menuItemId}" required/><br/><br/>

    <label>Quantity:</label>
    <input type="number" step="0.1" th:field="*{quantity}" required/><br/><br/>

    <label>Allergens:</label>
    <input type="text" th:field="*{allergens}"/><br/><br/>

    <button type="submit">Save</button>
</form>

<!-- ---------------- UPDATE ---------------- -->
<form th:if="${orderline.id != null}"
      th:action="@{'/orderlines/' + ${orderline.id}}"
      th:object="${orderline}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Menu Item ID:</label>
    <input type="text" th:field="*{menuItemId}" required/><br/><br/>

    <label>Quantity:</label>
    <input type="number" step="0.1" th:field="*{quantity}" required/><br/><br/>

    <label>Allergens:</label>
    <input type="text" th:field="*{allergens}"/><br/><br/>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/orderlines}">Back to list</a></p>

</body>
</html>
