<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Servers list</title>
</head>
<body>
<h1>Servers list</h1>

<p><a th:href="@{/servers/new}">Add new server</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Experience</th>
        <th>Designation</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="server : ${servers}">
        <td th:text="${server.id}">ID_Placeholder</td>
        <td th:text="${server.name}">Name_Placeholder</td>
        <td th:text="${server.experience}">Experience_Placeholder</td>
        <td th:text="${server.designation}">Designation_Placeholder</td>
        <td>
            <form th:action="@{'/servers/' + ${server.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
