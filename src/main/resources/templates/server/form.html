<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${server.id == null} ? 'Add Server' : 'Edit Server'"></title>
</head>
<body>

<h1 th:text="${server.id == null} ? 'Add New Server' : 'Edit Server'"></h1>

<!-- ---------------- CREATE ---------------- -->
<form th:if="${server.id == null}"
      th:action="@{/servers}"
      th:object="${server}"
      method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required/><br/><br/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Experience:</label>
    <input type="text" th:field="*{experience}" required/><br/><br/>

    <label>Designation:</label>
    <input type="text" th:field="*{designation}" required/><br/><br/>

    <button type="submit">Save</button>
</form>

<!-- ---------------- UPDATE ---------------- -->
<form th:if="${server.id != null}"
      th:action="@{'/servers/' + ${server.id}}"
      th:object="${server}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Experience:</label>
    <input type="text" th:field="*{experience}" required/><br/><br/>

    <label>Designation:</label>
    <input type="text" th:field="*{designation}" required/><br/><br/>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/servers}">Back to list</a></p>

</body>
</html>
