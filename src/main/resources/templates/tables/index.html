<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tables</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
    <style>
        /* keep tiny tweaks local */
        body { padding-top: 66px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
        <div class="ml-auto">
            <a class="btn btn-sm btn-brand btn-pill ml-2" th:href="@{/tables}">Tables</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0">Tables</h1>
            <div class="text-muted small">Manage restaurant tables</div>
        </div>
        <div class="text-right">
            <div class="mb-2">
                <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/tables/new}">Add Table</a>
            </div>
            <div class="text-muted small">Results</div>
            <div class="h5" th:text="${#lists.size(tables)}">0</div>
        </div>
    </div>

    <div class="card mb-3 filter-card">
        <div class="card-body">
            <form method="get" class="form-inline filter-row">
                <label for="number" class="mr-2">Number</label>
                <input id="number" name="number" type="number" inputmode="numeric" min="1" step="1" class="form-control mr-3" placeholder="Table #" th:value="${number}" />
                <div th:if="${filterError}" class="text-danger small ml-2" th:text="${filterError}"></div>

                <label for="status" class="mr-2">Status</label>
                <select id="status" name="status" class="form-control mr-3">
                    <option value="">All</option>
                    <option value="free" th:selected="${status == 'free'}">Free</option>
                    <option value="occupied" th:selected="${status == 'occupied'}">Occupied</option>
                </select>

                <label for="sortSelect" class="mr-2">Sort</label>
                <select id="sortSelect" name="sort" class="form-control mr-2">
                    <option value="id" th:selected="${currentSort == 'id'}">ID</option>
                    <option value="number" th:selected="${currentSort == 'number'}">Number</option>
                </select>

                <select name="dir" id="dirSelect" class="form-control mr-3">
                    <option value="asc" th:selected="${currentDir == 'asc'}">ASC</option>
                    <option value="desc" th:selected="${currentDir == 'desc'}">DESC</option>
                </select>

                <button type="submit" class="btn btn-brand btn-pill mr-2">Apply</button>
                <a th:href="@{/tables}" class="btn btn-outline-secondary btn-pill">Reset</a>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
            <tr>
                <th><a th:href="@{/tables(sort='id', dir=${currentSort=='id' && currentDir=='asc' ? 'desc' : 'asc'}, number=${number}, status=${status})}">ID
                    <span th:if="${currentSort=='id'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th><a th:href="@{/tables(sort='number', dir=${currentSort=='number' && currentDir=='asc' ? 'desc' : 'asc'}, number=${number}, status=${status})}">Number
                    <span th:if="${currentSort=='number'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th>Status</th>
                <th>Orders</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="table : ${tables}">
                <td th:text="${table.id}"></td>
                <td th:text="${table.number}"></td>
                <td th:text="${table.occupiedStatus}"></td>
                <td th:text="${#lists.size(table.orders)}"></td>
                <td class="table-actions text-right">
                    <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/tables/{id}(id=${table.id})}">Details</a>
                    <a class="btn btn-sm btn-outline-secondary btn-pill" th:href="@{/tables/{id}/edit(id=${table.id})}">Edit</a>
                    <form th:action="@{/tables/{id}/delete(id=${table.id})}" method="post" style="display:inline-block;">
                        <button type="submit" class="btn btn-sm btn-danger btn-pill">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tables)}">
                <td colspan="5" class="text-center text-muted">No tables found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <nav th:if="${page != null}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/tables(page=${page.number - 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, number=${number}, status=${status})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? ' active'">
                    <a class="page-link" th:href="@{/tables(page=${i}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, number=${number}, status=${status})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/tables(page=${page.number + 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, number=${number}, status=${status})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
