<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bills</title>
</head>
<body>

<h1>Bills</h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Order ID</th>
        <th>Total Price</th>
        <th>Payment Status</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="bill : ${bills}">

        <td th:text="${bill.id}"></td>

        <td>
            <a th:href="@{'/orders/' + ${bill.order.id}}"
               th:text="${bill.order.id}">
            </a>
        </td>

        <td th:text="${bill.totalPrice}"></td>

        <td th:text="${bill.paymentStatus}"></td>

        <td>

            <!-- TOGGLE BUTTON -->
            <form th:action="@{'/bills/' + ${bill.id} + '/toggle'}"
                  method="post"
                  style="display:inline;">
                <button type="submit"
                        th:text="${bill.paymentStatus == 'Paid'} ? 'Mark Unpaid' : 'Mark Paid'">
                </button>
            </form>

        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
