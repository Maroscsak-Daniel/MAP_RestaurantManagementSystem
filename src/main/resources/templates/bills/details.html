<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bill Details</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Bill Details</h4>
            <div class="text-muted small">#<span th:text="${bill.id}"></span></div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <p><strong>Order:</strong> <a th:href="@{/orders/{id}(id=${bill.order.id})}" th:text="${bill.order.id}"></a></p>
                    <p><strong>Total Price:</strong> <span th:text="${#numbers.formatDecimal(bill.totalPrice, 1, 'COMMA', 2, 'POINT')}"></span></p>
                    <p><strong>Status:</strong> <span class="status-badge" th:classappend="${bill.paymentStatus.name() == 'PAID' ? ' status-paid' : ' status-unpaid'}" th:text="${bill.paymentStatus.name()}"></span></p>
                </div>
                <div class="col-md-4 text-right">
                    <a class="btn btn-outline-secondary btn-pill mb-2" th:href="@{/bills}">Back</a>

                    <!-- payment toggle removed: edit bill to change PAID/UNPAID -->

                    <form th:action="@{/bills/{id}/delete(id=${bill.id})}" method="post" style="display:block;">
                        <button type="submit" class="btn btn-danger btn-pill">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
