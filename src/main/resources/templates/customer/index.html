<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista Clienți (Customers)</title>
</head>
<body>
<h1>Lista Clienți</h1>
<p><a th:href="@{/customers/new}">Adaugă Client Nou</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nume</th>
        <th>Acțiuni</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.id}">C000</td>
        <td th:text="${customer.name}">Nume Client</td>
        <td>
            <form th:action="@{'/customers/' + ${customer.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
