<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customers list</title>
</head>
<body>

<h1>Customers list</h1>

<p><a th:href="@{/customers/new}">Add new customer</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Number of Orders</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.id}"></td>
        <td th:text="${customer.name}"></td>
        <td th:text="${customer.orderIds != null ? customer.orderIds.size() : 0}"></td>

        <td>
            <a th:href="@{'/customers/' + ${customer.id}}">Details</a> |
            <a th:href="@{'/customers/' + ${customer.id} + '/edit'}">Edit</a> |

            <form th:action="@{'/customers/' + ${customer.id} + '/delete'}"
                  method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>

    </tr>
    </tbody>
</table>

</body>
</html>
