<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Table Details</title>
</head>
<body>

<h1>Table Details</h1>

<p><strong>ID:</strong> <span th:text="${table.id}"></span></p>
<p><strong>Number:</strong> <span th:text="${table.number}"></span></p>
<p><strong>Status:</strong> <span th:text="${table.occupiedStatus}"></span></p>

<p><strong>Orders:</strong></p>

<ul>
    <li th:each="oid : ${table.orderIds}" th:text="${oid}"></li>

    <li th:if="${table.orderIds == null or #lists.isEmpty(table.orderIds)}">
        No orders.
    </li>
</ul>

<p><a th:href="@{/tables}">Back to list</a></p>

</body>
</html>
