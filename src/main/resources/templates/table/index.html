<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tables list</title>
</head>
<body>
<h1>Tables list</h1>
<p><a th:href="@{/tables/new}">Add new table</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Table number</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="table : ${tables}">
        <td th:text="${table.id}">T000</td>
        <td th:text="${table.number}">0</td>
        <td th:text="${table.occupiedStatus}">Status</td>
        <td>
            <form th:action="@{'/tables/' + ${table.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
