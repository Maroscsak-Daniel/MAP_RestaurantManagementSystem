<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${#strings.isEmpty(table.id) ? 'Add Table' : 'Edit Table'}"></title>
</head>
<body>

<h1 th:text="${#strings.isEmpty(table.id) ? 'Add New Table' : 'Edit Table'}"></h1>

<form th:action="@{${#strings.isEmpty(table.id) ? '/tables' : '/tables/' + table.id}}"
      th:object="${table}" method="post">

    <!-- ID field (editable only on creation) -->
    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}"
           th:readonly="${!#strings.isEmpty(table.id)}"
           required/>
    <br/><br/>

    <!-- Table number -->
    <label for="number">Table number:</label>
    <input type="number" id="number" th:field="*{number}" required/>
    <br/><br/>

    <!-- Status -->
    <label for="occupiedStatus">Table status:</label>
    <select id="occupiedStatus" th:field="*{occupiedStatus}">
        <option value="free">Free</option>
        <option value="occupied">Occupied</option>
    </select>
    <br/><br/>

    <button type="submit">Save</button>
</form>

<p><a th:href="@{/tables}">Back to the list</a></p>

</body>
</html>
