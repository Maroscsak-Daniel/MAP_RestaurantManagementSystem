<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${table.id == null} ? 'Add Table' : 'Edit Table'"></title>
</head>
<body>

<h1 th:text="${table.id == null} ? 'Add New Table' : 'Edit Table'"></h1>

<!-- CREATE -->
<form th:if="${table.id == null}"
      th:action="@{/tables}"
      th:object="${table}"
      method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required/><br/><br/>

    <label>Number:</label>
    <input type="number" th:field="*{number}" required/><br/><br/>

    <label>Status:</label>
    <select th:field="*{occupiedStatus}">
        <option value="free">Free</option>
        <option value="occupied">Occupied</option>
    </select><br/><br/>

    <button type="submit">Save</button>
</form>

<!-- UPDATE -->
<form th:if="${table.id != null}"
      th:action="@{'/tables/' + ${table.id}}"
      th:object="${table}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Number:</label>
    <input type="number" th:field="*{number}" required/><br/><br/>

    <label>Status:</label>
    <select th:field="*{occupiedStatus}">
        <option value="free">Free</option>
        <option value="occupied">Occupied</option>
    </select><br/><br/>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/tables}">Back to list</a></p>

</body>
</html>
