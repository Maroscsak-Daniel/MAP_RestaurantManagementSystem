<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${menuitem.id == null} ? 'Add Menu Item' : 'Edit Menu Item'"></title>
</head>
<body>

<h1 th:text="${menuitem.id == null} ? 'Add New Menu Item' : 'Edit Menu Item'"></h1>

<!-- ---------------- CREATE ---------------- -->
<form th:if="${menuitem.id == null}"
      th:action="@{/menuitems}"
      th:object="${menuitem}"
      method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required/><br/><br/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required/><br/><br/>

    <button type="submit">Save</button>
</form>

<!-- ---------------- UPDATE ---------------- -->
<form th:if="${menuitem.id != null}"
      th:action="@{'/menuitems/' + ${menuitem.id}}"
      th:object="${menuitem}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required/><br/><br/>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/menuitems}">Back to list</a></p>

</body>
</html>
