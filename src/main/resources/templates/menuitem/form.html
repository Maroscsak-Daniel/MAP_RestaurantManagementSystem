<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add menu item</title>
</head>
<body>
<h1>Add new menu item</h1>
<form th:action="@{/menuitems}" th:object="${menuitem}" method="post">

    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}" required/><br/><br/>

    <label for="price">Price:</label>
    <input type="number" step="0.01" id="price" th:field="*{price}" required/><br/><br/>

    <button type="submit">Save item</button>
</form>
<p><a th:href="@{/menuitems}">Back to the list</a></p>
</body>
</html>
