<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Element Meniu</title>
</head>
<body>
<h1>Adaugă Element Meniu Nou</h1>
<form th:action="@{/menuitems}" th:object="${menuitem}" method="post">

    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="name">Nume:</label>
    <input type="text" id="name" th:field="*{name}" required/><br/><br/>

    <label for="price">Preț:</label>
    <input type="number" step="0.01" id="price" th:field="*{price}" required/><br/><br/>

    <button type="submit">Salvează Element</button>
</form>
<p><a th:href="@{/menuitems}">Înapoi la Listă</a></p>
</body>
</html>
