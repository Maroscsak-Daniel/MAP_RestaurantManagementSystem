<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menu Item Details</title>
</head>
<body>

<h1>Menu Item Details</h1>

<p><strong>ID:</strong> <span th:text="${menuitem.id}"></span></p>
<p><strong>Name:</strong> <span th:text="${menuitem.name}"></span></p>
<p><strong>Price:</strong>
    <span th:text="${#numbers.formatDecimal(menuitem.price, 0, 'COMMA', 2, 'POINT')}"></span>
</p>

<p><a th:href="@{/menuitems}">Back to list</a></p>

</body>
</html>
