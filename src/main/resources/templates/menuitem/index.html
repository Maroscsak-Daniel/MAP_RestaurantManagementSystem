<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menu item list</title>
</head>
<body>
<h1>Meniu item list</h1>
<p><a th:href="@{/menuitems/new}">Add new menu item</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${menuitems}">
        <td th:text="${item.id}">M000</td>
        <td th:text="${item.name}">Product name</td>
        <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT')}">0.00</td>
        <td>
            <form th:action="@{'/menuitems/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
