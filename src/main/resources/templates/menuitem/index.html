<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menu Item List</title>
</head>
<body>

<h1>Menu Item List</h1>

<p><a th:href="@{/menuitems/new}">Add new menu item</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${menuitems}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT')}"></td>

        <td>
            <a th:href="@{'/menuitems/' + ${item.id}}">Details</a> |
            <a th:href="@{'/menuitems/' + ${item.id} + '/edit'}">Edit</a> |

            <form th:action="@{'/menuitems/' + ${item.id} + '/delete'}"
                  method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
