<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Bill</title>
</head>
<body>
<h2>Add New Bill</h2>

<form action="/bills" method="post">
    <label>ID: </label><input type="text" name="id"><br>
    <label>Order ID: </label><input type="text" name="orderId"><br>
    <label>Total Amount: </label><input type="number" step="0.01" name="totalAmount"><br>
    <button type="submit">Save</button>
</form>

<a href="/bills">Back</a>
</body>
</html>
