<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Bucătar</title>
</head>
<body>
<h1>Adaugă Bucătar Nou</h1>
<form th:action="@{/chefs}" th:object="${chef}" method="post">

    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="name">Nume:</label>
    <input type="text" id="name" th:field="*{name}" required/><br/><br/>

    <label for="experience">Experiență:</label>
    <input type="text" id="experience" th:field="*{experience}" required/><br/><br/>

    <label for="specialization">Specializare:</label>
    <input type="text" id="specialization" th:field="*{specialization}" required/><br/><br/>

    <button type="submit">Salvează Bucătar</button>
</form>
<p><a th:href="@{/chefs}">Înapoi la Listă</a></p>
</body>
</html>
