<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
        <div class="ml-auto">
            <a class="btn btn-sm btn-outline-primary btn-pill mr-2" th:href="@{/orders/new}">Add Order</a>
            <a class="btn btn-sm btn-brand btn-pill ml-2" th:href="@{/orders}">Orders</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0">Orders</h1>
            <div class="text-muted small">Manage orders, assignments and lines</div>
        </div>
        <div class="text-right">
            <div class="mb-2">
                <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/orders/new}">Add Order</a>
            </div>
            <div class="text-muted small">Results</div>
            <div class="h5" th:text="${#lists.size(orders)}">0</div>
        </div>
    </div>

    <div class="card mb-3 filter-card">
        <div class="card-body">
            <form method="get" class="form-inline filter-row">
                <label for="statusSelect" class="mr-2">Status</label>
                <select id="statusSelect" name="status" class="form-control mr-3">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}"
                            th:value="${s}"
                            th:text="${s}"
                            th:selected="${s == currentStatus}">
                    </option>
                </select>

                <label for="customerInput" class="mr-2">Customer</label>
                <input id="customerInput" name="customer" class="form-control mr-3" placeholder="Name" th:value="${currentCustomer}" />

                <label for="sortSelect" class="mr-2">Sort</label>
                <select id="sortSelect" name="sort" class="form-control mr-2">
                    <option value="id" th:selected="${currentSort == 'id'}">ID</option>
                    <option value="status" th:selected="${currentSort == 'status'}">Status</option>
                    <option value="paymentMethod" th:selected="${currentSort == 'paymentMethod'}">Payment</option>
                </select>

                <select name="dir" id="dirSelect" class="form-control mr-3">
                    <option value="asc" th:selected="${currentDir == 'asc'}">ASC</option>
                    <option value="desc" th:selected="${currentDir == 'desc'}">DESC</option>
                </select>

                <button type="submit" class="btn btn-brand btn-pill mr-2">Apply</button>
                <a th:href="@{/orders}" class="btn btn-outline-secondary btn-pill">Reset</a>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
            <tr>
                <th><a th:href="@{/orders(sort='id', dir=${currentSort=='id' && currentDir=='asc' ? 'desc' : 'asc'}, status=${currentStatus}, customer=${currentCustomer})}">ID
                    <span th:if="${currentSort=='id'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th>Customer</th>
                <th><a th:href="@{/orders(sort='status', dir=${currentSort=='status' && currentDir=='asc' ? 'desc' : 'asc'}, status=${currentStatus}, customer=${currentCustomer})}">Status
                    <span th:if="${currentSort=='status'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th><a th:href="@{/orders(sort='paymentMethod', dir=${currentSort=='paymentMethod' && currentDir=='asc' ? 'desc' : 'asc'}, status=${currentStatus}, customer=${currentCustomer})}">Payment Method
                    <span th:if="${currentSort=='paymentMethod'}" th:text="${currentDir=='asc' ? '▲' : '▼'}"></span>
                </a></th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.customer != null ? o.customer.name : 'N/A'}"></td>
                <td>
                    <span class="status-badge" th:text="${o.status}"></span>
                </td>
                <td th:text="${o.paymentMethod}"></td>
                <td class="table-actions text-right">
                    <a class="btn btn-sm btn-outline-primary btn-pill" th:href="@{/orders/{id}(id=${o.id})}">View</a>
                    <a class="btn btn-sm btn-outline-secondary btn-pill" th:href="@{/orders/{id}/edit(id=${o.id})}">Edit</a>

                    <form th:action="@{/orders/{id}/delete(id=${o.id})}" method="post" style="display:inline-block;">
                        <button type="submit" class="btn btn-sm btn-danger btn-pill">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="5" class="text-center text-muted">No orders found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <nav th:if="${page != null}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/orders(page=${page.number - 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, status=${currentStatus}, customer=${currentCustomer})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? ' active'">
                    <a class="page-link" th:href="@{/orders(page=${i}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, status=${currentStatus}, customer=${currentCustomer})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/orders(page=${page.number + 1}, size=${page.size}, sort=${currentSort}, dir=${currentDir}, status=${currentStatus}, customer=${currentCustomer})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<!-- Bootstrap JS (optional) -->
<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>

</body>
</html>
