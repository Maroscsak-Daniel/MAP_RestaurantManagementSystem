<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Form</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 th:text="${order.id} == null ? 'Create Order' : 'Edit Order'">Form</h4>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form method="post"
                  th:action="${order.id} == null ? @{/orders} : @{/orders/{id}(id=${order.id})}"
                  th:object="${order}">

                <div class="form-group">
                    <label for="statusSelect">Status</label>
                    <select id="statusSelect" th:field="*{status}" class="form-control" required>
                        <option value="">Select status</option>
                        <option th:each="s : ${T(com.example.restaurant.model.OrderStatus).values()}"
                                th:value="${s}"
                                th:text="${s}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="paymentSelect">Payment Method</label>
                    <select id="paymentSelect" th:field="*{paymentMethod}" class="form-control" required>
                        <option value="">Select payment</option>
                        <option th:each="pm : ${T(com.example.restaurant.model.PaymentMethod).values()}"
                                th:value="${pm.name()}"
                                th:text="${pm}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="customerSelect">Customer</label>
                    <select id="customerSelect" th:field="*{customer.id}" class="form-control" required>
                        <option value="">Select customer</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tableSelect">Table</label>
                    <select id="tableSelect" th:field="*{table.id}" class="form-control" required>
                        <option value="">Select table</option>
                        <option th:each="t : ${tables}"
                                th:value="${t.id}"
                                th:text="${'Table ' + t.number}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-brand btn-pill" th:text="${order.id} == null ? 'Save' : 'Save'"></button>
                <a th:href="@{/orders}" class="btn btn-outline-secondary btn-pill">Cancel</a>
            </form>

        </div>
    </div>
</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
