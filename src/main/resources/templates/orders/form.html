<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Form</title>
    <link th:href="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css'}" rel="stylesheet" crossorigin="anonymous" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white" style="border-bottom:1px solid #e9ecef;">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">Restaurant</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 th:text="${order.id} == null ? 'Create Order' : 'Edit Order'">Form</h4>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Create form -->
            <form th:if="${order.id} == null" method="post" th:action="@{/orders}" th:object="${order}">
                <div class="form-group">
                    <label for="statusSelectCreate">Status</label>
                    <select id="statusSelectCreate" th:field="*{status}" class="form-control" th:classappend="${#fields.hasErrors('status')} ? ' is-invalid' : ''" required>
                        <option value="">Select status</option>
                        <option th:each="s : ${T(com.example.restaurant.model.OrderStatus).values()}"
                                th:value="${s}"
                                th:text="${s}">
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                </div>

                <div class="form-group">
                    <label for="paymentSelectCreate">Payment Method</label>
                    <select id="paymentSelectCreate" th:field="*{paymentMethod}" class="form-control" th:classappend="${#fields.hasErrors('paymentMethod')} ? ' is-invalid' : ''" required>
                        <option value="">Select payment</option>
                        <option th:each="pm : ${T(com.example.restaurant.model.PaymentMethod).values()}"
                                th:value="${pm.name()}"
                                th:text="${pm}">
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
                </div>

                <div class="form-group">
                    <label for="customerSelectCreate">Customer</label>
                    <select id="customerSelectCreate" th:field="*{customer.id}" class="form-control" th:classappend="${#fields.hasErrors('customer')} ? ' is-invalid' : ''" required>
                        <option value="">Select customer</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div>
                </div>

                <div class="form-group">
                    <label for="tableSelectCreate">Table</label>
                    <select id="tableSelectCreate" th:field="*{table.id}" class="form-control" th:classappend="${#fields.hasErrors('table')} ? ' is-invalid' : ''" required>
                        <option value="">Select table</option>
                        <option th:each="t : ${tables}"
                                th:value="${t.id}"
                                th:text="${'Table ' + t.number}">
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('table')}" th:errors="*{table}"></div>
                </div>

                <button type="submit" class="btn btn-brand btn-pill">Save</button>
                <a th:href="@{/orders}" class="btn btn-outline-secondary btn-pill">Cancel</a>
            </form>

            <!-- Edit form -->
            <form th:if="${order.id != null}" method="post" th:action="@{/orders/{id}(id=${order.id})}" th:object="${order}">
                <!-- If order is COMPLETED, only show status select with CANCELLED option -->
                <div th:if="${order.status.name() == 'COMPLETED'}">
                    <div class="form-group">
                        <label for="statusSelectEditCompleted">Status</label>
                        <select id="statusSelectEditCompleted" th:field="*{status}" class="form-control" th:classappend="${#fields.hasErrors('status')} ? ' is-invalid' : ''" required>
                            <option value="">Select status</option>
                            <option th:value="${T(com.example.restaurant.model.OrderStatus).CANCELLED}" th:text="${T(com.example.restaurant.model.OrderStatus).CANCELLED}"></option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>

                    <div class="alert alert-info">This order is completed; only cancelling is allowed.</div>
                </div>

                <!-- Otherwise allow full edit -->
                <div th:if="${order.status.name() != 'COMPLETED'}">
                    <div class="form-group">
                        <label for="statusSelectEditFull">Status</label>
                        <select id="statusSelectEditFull" th:field="*{status}" class="form-control" th:classappend="${#fields.hasErrors('status')} ? ' is-invalid' : ''" required>
                            <option value="">Select status</option>
                            <option th:each="s : ${T(com.example.restaurant.model.OrderStatus).values()}"
                                    th:value="${s}"
                                    th:text="${s}">
                            </option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>

                    <div class="form-group">
                        <label for="paymentSelectEdit">Payment Method</label>
                        <select id="paymentSelectEdit" th:field="*{paymentMethod}" class="form-control" th:classappend="${#fields.hasErrors('paymentMethod')} ? ' is-invalid' : ''" required>
                            <option value="">Select payment</option>
                            <option th:each="pm : ${T(com.example.restaurant.model.PaymentMethod).values()}"
                                    th:value="${pm.name()}"
                                    th:text="${pm}">
                            </option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
                    </div>

                    <div class="form-group">
                        <label for="customerSelectEdit">Customer</label>
                        <select id="customerSelectEdit" th:field="*{customer.id}" class="form-control" th:classappend="${#fields.hasErrors('customer')} ? ' is-invalid' : ''" required>
                            <option value="">Select customer</option>
                            <option th:each="c : ${customers}"
                                    th:value="${c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div>
                    </div>

                    <div class="form-group">
                        <label for="tableSelectEdit">Table</label>
                        <select id="tableSelectEdit" th:field="*{table.id}" class="form-control" th:classappend="${#fields.hasErrors('table')} ? ' is-invalid' : ''" required>
                            <option value="">Select table</option>
                            <option th:each="t : ${tables}"
                                    th:value="${t.id}"
                                    th:text="${'Table ' + t.number}">
                            </option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('table')}" th:errors="*{table}"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand btn-pill">Save</button>
                <a th:href="@{/orders}" class="btn btn-outline-secondary btn-pill">Cancel</a>
            </form>

        </div>
    </div>
</div>

<script th:src="@{'https://code.jquery.com/jquery-3.5.1.slim.min.js'}"></script>
<script th:src="@{'https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'}"></script>
<script th:src="@{'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js'}"></script>
</body>
</html>
