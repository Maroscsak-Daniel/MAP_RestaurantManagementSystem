<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Details</title>
</head>
<body>

<h1>Order Details</h1>

<p><strong>ID:</strong> <span th:text="${order.id}"></span></p>
<p><strong>Customer ID:</strong> <span th:text="${order.customerId}"></span></p>
<p><strong>Table ID:</strong> <span th:text="${order.tableId}"></span></p>
<p><strong>Status:</strong> <span th:text="${order.status}"></span></p>
<p><strong>Payment:</strong> <span th:text="${order.paymentMethod}"></span></p>

<h3>Order Lines:</h3>
<ul>
    <li th:each="line : ${order.orderLineIds}" th:text="${line}"></li>
    <li th:if="${order.orderLineIds == null or #lists.isEmpty(order.orderLineIds)}">
        No order lines
    </li>
</ul>

<h3>Assignments:</h3>
<ul>
    <li th:each="assign : ${order.assignmentIds}" th:text="${assign}"></li>
    <li th:if="${order.assignmentIds == null or #lists.isEmpty(order.assignmentIds)}">
        No assignments
    </li>
</ul>

<p><a th:href="@{/orders}">Back to list</a></p>

</body>
</html>
