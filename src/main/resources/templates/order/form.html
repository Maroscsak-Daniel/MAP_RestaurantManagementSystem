<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Comandă</title>
</head>
<body>
<h1>Adaugă Comandă Nouă</h1>
<form th:action="@{/orders}" th:object="${order}" method="post">

    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="customerId">Client ID:</label>
    <input type="text" id="customerId" th:field="*{customerId}" required/><br/><br/>

    <label for="tableId">Masă ID:</label>
    <input type="text" id="tableId" th:field="*{tableId}" required/><br/><br/>

    <label for="status">Status:</label>
    <select id="status" th:field="*{status}">
        <option value="Pending">Pending</option>
        <option value="Processing">Processing</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
    </select><br/><br/>

    <label for="paymentMethod">Metodă Plată:</label>
    <select id="paymentMethod" th:field="*{paymentMethod}">
        <option value="Cash">Cash</option>
        <option value="Card">Card</option>
    </select><br/><br/>

    <button type="submit">Salvează Comandă</button>
</form>
<p><a th:href="@{/orders}">Înapoi la Listă</a></p>
</body>
</html>
