<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders list</title>
</head>
<body>

<h1>Orders list</h1>

<p><a th:href="@{/orders/new}">Add new order</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Customer ID</th>
        <th>Table ID</th>
        <th>Status</th>
        <th>Payment</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.customerId}"></td>
        <td th:text="${order.tableId}"></td>
        <td th:text="${order.status}"></td>
        <td th:text="${order.paymentMethod}"></td>

        <td>
            <a th:href="@{'/orders/' + ${order.id}}">Details</a> |
            <a th:href="@{'/orders/' + ${order.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/orders/' + ${order.id} + '/delete'}"
                  method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
