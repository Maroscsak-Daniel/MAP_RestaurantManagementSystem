<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add chef</title>
</head>
<body>
<h1>Add new chef</h1>
<form th:action="@{/chefs}" th:object="${chef}" method="post">

    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{id}" required/><br/><br/>

    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}" required/><br/><br/>

    <label for="experience">Experience:</label>
    <input type="text" id="experience" th:field="*{experience}" required/><br/><br/>

    <label for="specialization">Specialization:</label>
    <input type="text" id="specialization" th:field="*{specialization}" required/><br/><br/>

    <button type="submit">Save chef</button>
</form>
<p><a th:href="@{/chefs}">Back to the list</a></p>
</body>
</html>
