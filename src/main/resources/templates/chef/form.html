<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${chef.id == null} ? 'Add Chef' : 'Edit Chef'"></title>
</head>
<body>

<h1 th:text="${chef.id == null} ? 'Add New Chef' : 'Edit Chef'"></h1>

<!-- ---------------- CREATE ---------------- -->
<form th:if="${chef.id == null}"
      th:action="@{/chefs}"
      th:object="${chef}"
      method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required/><br/><br/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Experience:</label>
    <input type="text" th:field="*{experience}" required/><br/><br/>

    <label>Specialization:</label>
    <input type="text" th:field="*{specialization}" required/><br/><br/>

    <button type="submit">Save</button>
</form>

<!-- ---------------- UPDATE ---------------- -->
<form th:if="${chef.id != null}"
      th:action="@{'/chefs/' + ${chef.id}}"
      th:object="${chef}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Experience:</label>
    <input type="text" th:field="*{experience}" required/><br/><br/>

    <label>Specialization:</label>
    <input type="text" th:field="*{specialization}" required/><br/><br/>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/chefs}">Back to list</a></p>

</body>
</html>
